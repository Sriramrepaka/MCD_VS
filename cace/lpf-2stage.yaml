#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           lpf-ota-2stage 
description:    Sallen-Key 2nd-order Low-Pass Filter block using 2-Stage-OTA
PDK:            ihp-sg13g2 # (for IIC-OSIC-Tools version 2025.01 or newer)
#PDK:           sg13g2 # (for IIC-OSIC-Tools version 2024.12 or older)

cace_format:    5.2

authorship:
  designer:         Harald Pretl
  company:          Johannes Kepler University
  creation_date:    August 25, 2024
  license:          Apache 2.0

paths:
  root:             ..
  schematic:        xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             _runs

pins:
  vdd:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 1.45
    Vmax: 1.55
  vss:
    description: Analog ground
    type: ground
    direction: inout
  ibias_20u:
    description: Bias current input 20uA nom.
    type: signal
    direction: input
  vinp:
    description: Voltage positive input
    type: signal
    direction: input
  vinn:
    description: Voltage negative input
    type: signal
    direction: input
  vout:
    description: Voltage output
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: Vdd
    unit: V
    typical: 1.5
  ibias:
    description: Bias current
    display: Ibias
    unit: uA
    typical: 20
  corner:
    description: Process corner
    display: Corner
    typical: tt
  corner_res:
    description: Resistor process corner
    display: Res Corner
    typical: typ
  corner_cap:
    description: Capacitor process corner
    display: Cap Corner
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27

parameters:
  ac_params:
    spec:
      gain:
        display: Passband Gain
        description: Low-frequency filter passband voltage gain ratio
        unit: V/V
        minimum:
          value: 0.95
        typical:
          value: any
        maximum:
          value: 1.03
      bw:
        display: Cutoff Frequency (-3dB)
        description: The -3dB cutoff frequency of the filter
        unit: Hz
        minimum:
          value: 9.0e3
        typical:
          value: 10.0e3
        maximum:
          value: 11.0e3
    tool:
      ngspice:
        template: lpf-ota-2stage-ac.sch
        format: ascii
        suffix: .data
        variables: [gain, bw]
    plot:
      gain_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: gain
        limits: auto
      gain_vs_vin:
        type: xyplot
        xaxis: vin
        yaxis: gain
        limits: auto
      gain_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: gain
        limits: auto
      gain_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: gain
        limits: auto
      bw_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: bw
        limits: auto
      bw_vs_vin:
        type: xyplot
        xaxis: vin
        yaxis: bw
        limits: auto
      bw_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: bw
        limits: auto
      bw_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: bw
        limits: auto
    conditions:
      corner:
        enumerate: [ss, sf, tt, fs, ff]
      corner_res:
        typical: typ
      corner_cap:
        typical: typ
      vdd:
        minimum: 1.45
        typical: 1.5
        maximum: 1.55
      vin:
        minimum: 0.7
        typical: 0.8
        maximum: 0.9
      temp:
        minimum: -40
        typical: 27
        maximum: 130

  ac_mc_params:
    spec:
      gain_mc:
        display: Passband Gain (MC)
        description: Large-signal dc gain (Monte Carlo)
        unit: V/V
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      bw_mc:
        display: Cutoff (MC)
        description: The -3dB cutoff of the filter (Monte Carlo)
        unit: Hz
        minimum:
          value: 9e3
        typical:
          value: 10e3
        maximum:
          value: 11e3
    tool:
      ngspice:
        template: lpf-ota-2stage-ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [gain_mc, bw_mc]
        script: ota-2stage-ac.py
        script_variables: [gain_mc_arr, bw_mc_arr]
    plot:
      gain_mc:
        type: histogram
        xaxis: gain_mc_arr
      bw_mc:
        type: histogram
        xaxis: bw_mc_arr
    conditions:
      iterations: # for Monte Carlo
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 100
        step: linear
        stepsize: 1
      sigma:
        # This is actually mc_ok.
        # If mc_ok = 1: MC with 3 sigma.
        # If mc_ok = 0: MC is turned off.
        # https://github.com/IHP-GmbH/IHP-Open-PDK/issues/149
        #minimum: 0
        typical: 1
      corner:
        typical: tt_stat # Monte Carlo corner for TT
      corner_res:
        typical: typ
      corner_cap:
        typical: typ
      vdd:
        typical: 1.5
      vin:
        typical: 0.8
      temp:
        typical: 27
        
  noise_params:
    spec:
      noise:
        display: Output noise
        description: Total output noise (rms)
        unit: mV
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 5.0
    tool:
      ngspice:
        template: lpf-ota-2stage-noise.sch
        format: ascii
        suffix: .data
        variables: [noise]
    plot:
      noise_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: noise
        limits: auto
      noise_vs_vin:
        type: xyplot
        xaxis: vin
        yaxis: noise
        limits: auto
      noise_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: noise
        limits: auto
      noise_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: noise
        limits: auto
    conditions:
      corner:
        enumerate: [ss, sf, tt, fs, ff]
      corner_res:
        typical: typ
      corner_cap:
        typical: typ
      vdd:
        minimum: 1.45
        typical: 1.5
        maximum: 1.55
      vin:
        typical: 0.8
      temp:
        minimum: -40
        typical: 27
        maximum: 130
      
  tran_params:
    spec:
      tsettle:
        display: Settling time
        description: Settling time of output
        unit: us
        minimum:
          value: any
        typical:
          value: 150
        maximum:
          value: 400
    tool:
      ngspice:
        template: lpf-ota-2stage-tran.sch
        format: ascii
        suffix: .data
        variables: [tsettle]
    plot:
      settling_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: tsettle
        limits: auto
      settling_vs_vin:
        type: xyplot
        xaxis: vin
        yaxis: tsettle
        limits: auto
      settling_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: tsettle
        limits: auto
      settling_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: tsettle
        limits: auto
    conditions:
      corner:
        enumerate: [ss, sf, tt, fs, ff]
      corner_res:
        typical: typ
      corner_cap:
        typical: typ
      vdd:
        minimum: 1.45
        typical: 1.5
        maximum: 1.55
      vin:
        minimum: 0.7
        typical: 0.8
        maximum: 0.9
      temp:
        minimum: -40
        typical: 27
        maximum: 130
